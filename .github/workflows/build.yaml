name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    # npm install (not `npm ci`): the committed lockfile omits per-platform
    # optional native bindings for Vite 8 / Rolldown, so `npm ci` fails to
    # install @rolldown/binding-linux-x64-gnu on the Linux runner. `npm install`
    # re-resolves optional deps against the runner's platform.
    - run: npm install --no-audit --no-fund
    - run: npm run build
